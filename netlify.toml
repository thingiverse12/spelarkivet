# Static deploy config for Duty Calls (browser FPS).
#
# Netlify serves static files only, so the Node server in /server cannot run
# here — the client detects that and falls back to local bot matches.
# For real online multiplayer, deploy `node server/server.js` on any Node host.

[build]
  publish = "."
  command = "echo 'Static site — nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/katt-runner/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  publish = "."
  framework = "#static"
  port = 8888
  targetPort = 8000
  autoLaunch = false
